name: HireHub CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Backend Verification & Unit Tests
  # ===========================================================================
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Fast Unit Tests
        run: |
          mvn -B test -Dtest=AuthServiceTest,JobServiceTest,ApplicationServiceTest,JwtTokenProviderTest,HireHubUserDetailsServiceTest

      - name: Build Fat JAR
        run: |
          mvn -B clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirehub-backend-jar
          path: target/*.jar
          retention-days: 7

  # ===========================================================================
  # 2. Frontend Lint & Production Build
  # ===========================================================================
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Upload SPA Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirehub-frontend-dist
          path: frontend/dist
          retention-days: 7

  # ===========================================================================
  # 3. Docker Compose Build Verification
  # ===========================================================================
  docker-verify:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build
